# Current MR60FDA2 kit configuration (fall detection + presence).
# Source of truth: https://github.com/limengdu/MR60FDA2_ESPHome_external_components/blob/main/example/mr60fda2.yaml
#
# This file is for the MR60FDA2 fall-detection kit. The MR60BHA2 breath and
# heartbeat kit uses a different repository and YAML; using that YAML here
# leaves Person Information and Falling Information at Unknown.

substitutions:
  name: "seeedstudio-mr60fda2-kit"
  friendly_name: "Seeed Studio MR60FDA2 Kit"
  # ESPHome dashboard users can keep this GitHub source.
  # CI rewrites it to the components/ directory in this checkout.
  seeed_mr60fda2_source: github://limengdu/MR60FDA2_ESPHome_external_components@main

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "seeedstudio.mr60fda2_kit"
    version: "2.2"
  platformio_options:
    board_upload.maximum_size: 4194304
  min_version: "2024.3.2" # Fix logger compile error on ESP32-C6 esphome#6323

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB # upload.flash_size
  framework:
    type: esp-idf

external_components:
  - source: ${seeed_mr60fda2_source}
    components: [ seeed_mr60fda2 ]
    refresh: 0s

# Enable logging
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  # Join a home network at boot by uncommenting the next two lines
  # (or putting the same keys in secrets.yaml).
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password
  # Without ssid/password the device opens this fallback hotspot so you can
  # enter credentials at 192.168.4.1.
  ap:
    ssid: "seeedstudio-mr60fda2"

captive_portal:

# For XIAO ESP32C6 Onboard LED
# light:
#   - platform: status_led
#     name: "Switch state"
#     pin: GPIO15

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Seeed MR60FDA2 RGB Light"
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
  id: bus_a

sensor:
  - platform: bh1750
    name: "Seeed MR60FDA2 Illuminance"
    address: 0x23
    update_interval: 1s

uart:
  id: seeed_mr60fda2_uart
  baud_rate: 115200
  rx_pin: 17
  tx_pin: 16
  parity: NONE
  stop_bits: 1

seeed_mr60fda2:
  id: my_seeed_mr60fda2
  uart_id: seeed_mr60fda2_uart

binary_sensor:
  - platform: seeed_mr60fda2
    people_exist:
      name: "Person Information"
    fall_detected:
      name: "Falling Information"

button:
  - platform: seeed_mr60fda2
    get_radar_parameters:
      name: "Get Radar Parameters"
    factory_reset:
      name: "Reset"

select:
  - platform: seeed_mr60fda2
    install_height:
      name: "Set Install Height"
    height_threshold:
      name: "Set Height Threshold"
    sensitivity:
      name: "Set Sensitivity"
